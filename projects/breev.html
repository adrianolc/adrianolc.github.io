<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BREEV - Breathing and relaxing</title>
    <link rel="stylesheet" href="../style/main.css" />
    <script src="https://kit.fontawesome.com/30a962be43.js" crossorigin="anonymous"></script>
    <style>
        .hero-header {
            position: relative;
            min-height: 60vh;
            overflow: hidden;
        }

        .hero-header::before {
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            
            background-color: #EBE1DA;

            /* The Image Configuration */
            background-image: url(../imgs/breev-circle.png);
            background-repeat: no-repeat;
            background-size: cover;
            background-position: center;
            
            /* The Blur Effect */
            filter: blur(50px);
            
            /* The Fix for White Edges */
            transform: scale(1.3); 
            
            /* Push it behind the text */
            z-index: -1; 
        }

        .content {
            max-width: 900px;
            margin: 0 auto;
            padding: 0 2rem;
        }


        .hero-header .content {
            min-height: 60vh;
            align-content: center;
        }

        .hero-header .content h1 {
            color: #1F2937;
            letter-spacing: .2rem;
            font-size: 3em;
        }

        .hero-header .content h1 .thin {
            font-weight: 100;
        }

        .hero-header .content h1 .light {
            font-weight: 300;
        }

        .hero-header .content h1 .medium {
            font-weight: 500;
        }

        .hero-header .content h1 .bold {
            font-weight: 700;
        }

        .hero-header .content p {
            color: #424242;
        }

        .logo {
            position: relative;
            top: -42px;
            z-index: 10;
        }

        .logo img {
            box-shadow: 0 2rem 4rem rgba(0,0,0,0.5);
            border-radius: 1rem;
            width: 84px;
            height: 84px;
        }

        .store {
            display: flex;         
            gap: 10px;             
            flex-wrap: wrap;  
            margin-top: 1.5rem;
        }

        .store .tag {
            display: flex;
            align-items: center;  
            background: rgba(255,255,255,0.3);
            backdrop-filter: blur(5px);
            padding: 0.75rem;
            border-radius: 50px;
            margin-bottom: 1rem;
            font-size: .8em;
            width: fit-content;
        }

        .store .tag:hover {
            background: rgba(194, 162, 255, 0.4);
        }

        .store .tag .icon {
            color: var(--bg-light-blue);
            font-size: 1.8em;
            display: flex;
            align-items: center;
        }

        .store a {
            text-decoration: none;
        }

        .store a:visited {
            text-decoration: none;
            color: #424242;
        }

        .store a:active {
            text-decoration: none;
            color: #424242;
        }

        .store .btn-text {
            vertical-align: middle;
            margin-left: .8rem;
        }
        
    </style>
</head>
<body>
    <header class="hero-header">
        <div class="content">
            <h1>
                <span class="thin">B</span>
                <span class="light">R</span>
                <span class="medium">E</span>
                <span class="bold">E</span>
                <span class="bold">V</span>
            </h1>
            <p>A simple way to pause, relax, and reset.</p>
            <div class="store">
                <a href="#" class="tag">
                    <span class="icon">
                        <i class="fa-brands fa-apple"></i>
                    </span>
                    <span class="btn-text">
                        Apple Store
                    </span> 
                </a>
                <a href="#" class="tag">
                    <span class="icon">
                        <i class="fa-brands fa-android"></i>
                    </span>
                    <span class="btn-text">
                        Google Play
                    </span>
                </a>
            </div>
        </div>
    </header>
    <section>
        <div class="logo content">
            <img src="../imgs/breev.png" />
        </div>
    </section>
</body>
</html>
